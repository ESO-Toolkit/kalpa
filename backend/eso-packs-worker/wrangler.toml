name = "kalpa-pack-hub"
main = "src/index.ts"
compatibility_date = "2025-09-15"
# Set CLOUDFLARE_ACCOUNT_ID env var or run `wrangler whoami` to configure.
# account_id = ""

[[kv_namespaces]]
binding = "ESO_PACKS"
id = "ad8677b4cef048d68de9f8f4d0ef74a9"

# Secrets are set via `wrangler secret put ADMIN_API_KEY`.
# For local dev, create a .dev.vars file (git-ignored):
#   ADMIN_API_KEY=dev-secret-key

[vars]
# Remains log-only until a maintainer approves deletion-capable apply mode.
D1_RECONCILIATION_MODE = "dry-run"
# Nightly ESOUI addon-index crawl. Fail-closed: only the exact value "enabled"
# turns it on. Flip this to "enabled" AFTER provisioning ADDON_INDEX and running
# the initial backfill to completion — not before, or the cron starts calling a
# third-party API on a half-built index.
ADDON_INDEX_SYNC = "disabled"
# Workers AI model for /ask. Swappable without a code change.
ASK_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
# Model calls per UTC day before /ask degrades to candidates-only. Workers AI
# gives 10k neurons/day free and one ask costs ~25, so ~400/day is the free
# ceiling; this sits under it deliberately.
ASK_DAILY_BUDGET = "350"

# Daily backup of pack index (midnight UTC)
[triggers]
crons = ["0 0 * * *"]

# Shared D1 binding — same database roster-hub-api uses.
# Dual-write: every KV mutation is mirrored to D1 inline so
# esotk.com always reflects the latest pack data.
[[d1_databases]]
binding = "ROSTER_HUB_DB"
database_name = "roster-hub-db"
database_id = "22ff9f6a-ddb4-43bc-a0ef-89881124cfa2"

# ── Rate limiting (built-in atomic binding, GA Sep 2025) ──────────
[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "VOTE_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "ADDON_SEARCH_LIMITER"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 8
  period = 60

# ── Workers AI (natural-language addon assistant) ─────────────────
# No provisioning needed — this binding is all it takes. Free allocation is
# 10,000 neurons/day; one ask is ~25 neurons.
[ai]
binding = "AI"

# ── ESOUI addon full-text index (D1 + FTS5) ───────────────────────
# Dedicated database. Deliberately NOT roster-hub-db: that one is shared with
# the ESO Toolkit website and every schema change there needs coordinating.
#
# Uncomment after provisioning, pasting the id wrangler prints:
#   wrangler d1 create kalpa-addon-index
#
# The ADDON_INDEX binding is optional in code — while this stays commented out
# the worker serves Pack Hub exactly as before and /addons/* returns 503.
#
# [[d1_databases]]
# binding = "ADDON_INDEX"
# database_name = "kalpa-addon-index"
# database_id = "PASTE_ID_FROM_WRANGLER_D1_CREATE"

# ── Durable Object for atomic pack index mutations ────────────────
[[durable_objects.bindings]]
name = "PACK_INDEX"
class_name = "PackIndexDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PackIndexDO"]

[observability]
enabled = false
