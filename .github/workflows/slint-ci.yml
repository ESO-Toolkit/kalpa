name: Slint Prototype CI

# The Slint native UI ships as a Windows sidecar of the main app (see
# src-tauri/tauri.windows.conf.json + scripts/build-native-slint-sidecar.mjs),
# so its tree must stay green — but it is a full separate Rust workspace that
# would roughly double CI time if built on every PR. Path-filter it instead:
# any PR touching the prototype or its packaging wiring gets the full gate.
on:
  pull_request:
    branches: [main]
    paths:
      - "prototypes/slint-kalpa/**"
      - "scripts/build-native-slint-sidecar.mjs"
      - ".github/workflows/slint-ci.yml"
  # Also run on main pushes: GitHub Actions caches saved on PR branches are
  # not visible to tag refs, so without a main-scope run the release job would
  # compile slint/skia cold (~20 min) on every tag. Main-branch caches ARE
  # inherited by tags.
  push:
    branches: [main]
    paths:
      - "prototypes/slint-kalpa/**"
      - "scripts/build-native-slint-sidecar.mjs"
      - ".github/workflows/slint-ci.yml"

permissions:
  contents: read

concurrency:
  group: slint-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-slint:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.94.0"
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: prototypes/slint-kalpa

      - name: Rust format check
        run: cargo fmt --check --manifest-path prototypes/slint-kalpa/Cargo.toml

      # --all-targets so the #[cfg(test)] code is linted too. Without it the test
      # module accumulated 20 warnings CI could not see, and a lint regression
      # there is invisible until someone runs clippy locally.
      - name: Rust clippy
        run: cargo clippy --manifest-path prototypes/slint-kalpa/Cargo.toml --all-targets -- -D warnings

      # H6 removed RUSTSEC-2026-0194 / -0195 by moving every resolved quick-xml
      # edge to 0.41.0. Keep this focused on that fixed bug class: the sidecar's
      # other cargo-audit findings have separate upstream owners and remediation.
      - name: quick-xml advisory regression
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --format-version 1 --manifest-path prototypes/slint-kalpa/Cargo.toml | ConvertFrom-Json
          $versions = @($metadata.packages | Where-Object name -eq "quick-xml" | ForEach-Object { [version]$_.version })
          if ($versions.Count -eq 0) {
            throw "quick-xml is absent from the resolved Slint graph; update the H6 gate intentionally"
          }
          $vulnerable = @($versions | Where-Object { $_ -lt [version]"0.41.0" })
          if ($vulnerable.Count -gt 0) {
            throw "RUSTSEC-2026-0194/-0195: vulnerable quick-xml resolved: $($vulnerable -join ', ')"
          }
          Write-Host "quick-xml advisory floor satisfied: $($versions -join ', ')"

      - name: Rust tests
        run: cargo test --manifest-path prototypes/slint-kalpa/Cargo.toml

      # Run the REAL packaging script (release build + copy into
      # src-tauri/binaries with the target-triple name the bundler expects), so
      # the first end-to-end execution is never the release tag itself.
      - name: Build + package the sidecar exactly as a release does
        run: node scripts/build-native-slint-sidecar.mjs

      - name: Verify the sidecar artifact the bundler will look for
        shell: bash
        run: |
          set -euo pipefail
          triple=$(rustc --print host-tuple)
          artifact="src-tauri/binaries/kalpa-slint-${triple}.exe"
          [ -s "$artifact" ] || { echo "::error::${artifact} missing or empty"; exit 1; }
          echo "sidecar artifact OK: $artifact ($(stat -c%s "$artifact") bytes)"
