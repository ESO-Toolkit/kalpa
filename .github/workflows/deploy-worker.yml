name: Deploy Pack Hub Worker

on:
  push:
    branches: [main]
    paths:
      - "backend/eso-packs-worker/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/eso-packs-worker

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: backend/eso-packs-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Covers src and the test files (test/tsconfig.json) — see ci.yml.
      - name: TypeScript check
        run: npm run check

      - name: Run tests
        run: npx vitest run

      - name: Verify worker name is kalpa-pack-hub
        run: |
          NAME=$(grep '^name' wrangler.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          if [ "$NAME" != "kalpa-pack-hub" ]; then
            echo "::error::wrangler.toml name is '$NAME', expected 'kalpa-pack-hub'. Aborting to prevent deploying to the wrong worker."
            exit 1
          fi

      - name: Dry-run deploy (validate bundle)
        run: npx wrangler deploy --dry-run --outdir dist
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Capture pre-deploy worker version
        id: pre_deploy
        run: |
          VERSION_ID=$(npx wrangler deployments list --json | jq -er '
            sort_by(.created_on)
            | last
            | .versions
            | map(select(.percentage == 100))
            | first
            | .version_id
          ')
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Post-deploy health check
        run: |
          sleep 5
          HEALTH=$(curl -sf https://kalpa-pack-hub.eso-toolkit.workers.dev/health || true)
          echo "$HEALTH"
          STATUS=$(echo "$HEALTH" | jq -r '.status // empty' 2>/dev/null || true)
          KV=$(echo "$HEALTH" | jq -r '.kv // empty' 2>/dev/null || true)
          if [ "$STATUS" != "ok" ] || [ "$KV" != "true" ]; then
            echo "::error::Health check failed! status=$STATUS kv=$KV"
            if ! npx wrangler rollback "${{ steps.pre_deploy.outputs.version_id }}" --yes --message "Automatic rollback after failed health check"; then
              echo "::error::Rollback failed; manual intervention is required."
            fi
            exit 1
          fi
          echo "Health check passed."
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
