name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # Six fields across five files carry the app version, and a bump has to
      # land in every one of them. Nothing enforced that, and nine consecutive
      # tags (alpha.8 through beta.9) shipped with package-lock.json still
      # pinned to an older version. The release publish gate only compares
      # tauri.conf.json to the tag, so a stale src-tauri/Cargo.toml sails
      # straight past it and ships a binary that reports the wrong version.
      # Sits ahead of npm ci and the Rust toolchain deliberately: it reads five
      # files with zero dependencies, so drift fails the PR in seconds instead
      # of at the end of the 20-minute Rust build.
      - name: Version consistency
        run: node scripts/check-versions.js

      # Pure Node and dependency-free: keep Discord release history, platform
      # detection, embed limits, and mention safety correct before a workflow
      # can post externally.
      - name: Discord release message tests
        run: node --test .github/scripts/discord-release.test.cjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      # --legacy-peer-deps: typescript-eslint 8.x doesn't yet support TypeScript 6
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      # Audit production dependencies only. The high-severity advisories that
      # otherwise fire here are all in dev/build tooling that never ships in the
      # desktop client (undici←jsdom for Vitest's DOM, hono←shadcn CLI), with no
      # upstream fix to bump to. --omit=dev still catches anything that would
      # actually run in the shipped app. Mirrors the Worker audit step below.
      - name: npm audit
        # --omit=dev mirrors the worker audit step: high-severity advisories in
        # dev-only tooling (jsdom→undici, shadcn→hono/js-yaml) don't ship in the
        # app, so audit production deps only.
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/

      # Wider than src/: public/theme-boot.js runs before first paint and
      # scripts/ holds the release gates, and neither was covered by any
      # formatting check — public/theme-boot.js had been dirty for some time.
      - name: Prettier
        run: npm run format:check

      - name: Rust format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Prepare native Slint sidecar placeholder
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Set-Content -NoNewline -Path src-tauri/binaries/kalpa-slint-x86_64-pc-windows-msvc.exe -Value ""

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # RUSTSEC-2026-0194 / -0195 (quick-xml quadratic-runtime DoS on duplicate
      # attribute names, fixed in quick-xml >=0.41.0) are transitive advisories
      # with no available non-breaking fix: quick-xml <0.41 is pinned by plist
      # (via tauri-utils / tauri 2.11) and by tauri-winrt-notification (via
      # tauri-plugin-notification -> notify-rust), neither of which yet accepts
      # quick-xml 0.41. The desktop client never parses untrusted XML through
      # these paths (build-time plist + Windows toast notifications), so ignore
      # until the upstream tauri crates bump quick-xml. Mirrors the npm audit
      # dev-only suppressions above.
      - name: Rust dependency audit
        run: |
          cargo install cargo-audit@0.22.1 --quiet --locked
          cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

      - name: Install worker dependencies
        run: npm ci
        working-directory: backend/eso-packs-worker

      # --omit=dev: the worker's only high-severity advisories are in dev/test
      # tooling (esbuild, via @cloudflare/vitest-pool-workers and wrangler),
      # which never ships to Cloudflare. Even the latest Cloudflare tooling
      # still pins the flagged esbuild, so there is no upstream fix to bump to.
      # Auditing production dependencies still catches anything that would
      # actually run in the deployed worker.
      - name: Worker npm audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend/eso-packs-worker

      # `npm run check` rather than a bare tsc: it typechecks the test files too,
      # via test/tsconfig.json. That config was stale and errored on every run,
      # so nothing had ever compiled the worker's tests.
      - name: Worker TypeScript check
        run: npm run check
        working-directory: backend/eso-packs-worker

      - name: Worker unit tests
        run: npx vitest run
        working-directory: backend/eso-packs-worker

      - name: Frontend unit tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri
        run: cargo build --manifest-path src-tauri/Cargo.toml

  # NO e2e job here, and it is not an oversight — `npm run test:e2e:sandbox` is
  # local-only, like `npm run test:packaged`.
  #
  # It was tried on windows-latest three times and failed identically each time.
  # The evidence, from the harness's own diagnostic: the Rust build succeeds, the
  # app launches, our PID is the only kalpa.exe, the process stays alive for the
  # full 120s wait — and `netstat` reports NOTHING listening on 9222. WebView2
  # never binds the debug port on a GitHub runner even though lib.rs sets
  # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS and `tauri build --debug` really does
  # produce a debug_assertions binary.
  #
  # Ruled out along the way: IPv6-vs-IPv4 loopback (the probe now uses 127.0.0.1
  # and still gets ECONNREFUSED), a too-short timeout (30s -> 120s), a
  # non-writable WebView2 user-data folder (given its own directory), and a
  # missing Playwright browser (connectOverCDP never launches one).
  #
  # Before trying again, prove WebView2 can bind a debug port at all on the
  # runner with a minimal app — do not re-litigate the list above.

  # Compile + test the Linux port. Lint/format/audit run once in the Windows
  # job above; this job proves the Linux cfg arms build clean and pass tests.
  # ubuntu-22.04 is the release baseline (WebKitGTK 4.1, glibc 2.35).
  check-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.94.0"
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libxdo-dev build-essential curl wget file

      # --legacy-peer-deps: typescript-eslint 8.x doesn't yet support TypeScript 6
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Frontend unit tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri
        run: cargo build --manifest-path src-tauri/Cargo.toml

  # Compile + test the macOS port (arm64 runner; the release build adds the
  # x86_64 target for a universal binary — CI stays single-arch for speed).
  check-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.94.0"
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      # --legacy-peer-deps: typescript-eslint 8.x doesn't yet support TypeScript 6
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri
        run: cargo build --manifest-path src-tauri/Cargo.toml
