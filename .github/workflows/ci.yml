name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter. With one, a PR based on anything other than main --
  # a stacked PR, or a feature branch collecting work before it goes up -- ran
  # no checks at all, and GitHub reported "no checks reported" rather than a
  # failure. That reads as neutral, so unverified code looks the same as passing
  # code right up until it is merged into a PR that IS checked. Run everywhere
  # and let the base branch be the reviewer's concern, not the gate's.
  pull_request:

permissions:
  contents: read

jobs:
  # Nothing had ever linted these workflow files. `npx eslint src/` and
  # `npm run format:check` both stop at the repo's own source, so the only
  # thing that has ever read a workflow is a human -- which is how the beta.23
  # audit found the shell-injection in deploy-worker.yml, by hand, on release
  # eve. actionlint parses every workflow, resolves the expression contexts,
  # and pipes each `run:` block through shellcheck.
  #
  # What it does NOT catch, stated plainly so nobody assumes otherwise: it
  # would not have found the beta.23 injection. actionlint's script-injection
  # rule fires on a fixed list of attacker-controlled `github.*` values
  # (`github.event.*`, `github.head_ref`, ...); a `${{ steps.<id>.outputs.* }}`
  # splice into a `run:` line is not on that list. Reconstructed and rerun
  # against the pre-fix deploy-worker.yml with shellcheck enabled: exit 0.
  # Reviewing command output spliced into `run:` is still a human job.
  #
  # What it does buy: the `github.event.*` injection class, unknown runner
  # labels, undefined step ids and contexts, malformed `if:` expressions, bad
  # cron syntax, and shellcheck over every `run:` block.
  #
  # Its own job, and first, for the same reason the version check leads the
  # `check` job: this reports in well under a minute instead of behind the
  # 20-minute Rust build.
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by the release artifact's own SHA-256 rather than by a
      # third-party wrapper action: pulling in someone else's action to run the
      # supply-chain linter would widen the exact surface this job exists to
      # narrow. `sha256sum --check` makes the download fail closed, so a
      # swapped asset stops the job instead of silently linting with an
      # unknown binary.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 --retry 3 --retry-delay 2 \
            -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint --version

      # No file arguments: actionlint finds the repo root itself and lints
      # every workflow under .github/workflows, so a workflow added later is
      # covered without touching this job. It exits 1 on any finding, which is
      # what fails the step.
      #
      # shellcheck ships preinstalled on ubuntu-latest and actionlint picks it
      # up off PATH; that is where the `run:` block coverage comes from, so do
      # not move this job to a runner without it.
      #
      # -ignore SC1083 is a targeted suppression, not a blanket one.
      # release.yml's authorize job runs `git rev-parse HEAD^{commit}`, where
      # the braces are git's peel syntax and are meant to reach git literally;
      # shellcheck reads them as a malformed brace expansion and warns four
      # times. Quoting those two rev-specs in release.yml is the real fix --
      # delete this flag when that lands. Suppressed rather than left red
      # because a gate that fails on arrival gets waved through, which is the
      # habit that let these files go unlinted in the first place.
      - name: actionlint
        run: ./actionlint -ignore 'SC1083'

  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # Six fields across five files carry the app version, and a bump has to
      # land in every one of them. Nothing enforced that, and nine consecutive
      # tags (alpha.8 through beta.9) shipped with package-lock.json still
      # pinned to an older version. The release publish gate only compares
      # tauri.conf.json to the tag, so a stale src-tauri/Cargo.toml sails
      # straight past it and ships a binary that reports the wrong version.
      # Sits ahead of npm ci and the Rust toolchain deliberately: it reads five
      # files with zero dependencies, so drift fails the PR in seconds instead
      # of at the end of the 20-minute Rust build.
      - name: Version consistency
        run: node scripts/check-versions.js

      # Pure Node and dependency-free: keep Discord release history, platform
      # detection, embed limits, and mention safety correct before a workflow
      # can post externally.
      - name: Release and Discord message tests
        run: node --test .github/scripts/discord-release.test.cjs .github/scripts/release-body.test.cjs

      # `npm run test:packaged` as a whole is local-only (see the e2e note
      # below), but its CDP-port preflight is not: that part needs no build, no
      # WebView2 and no debug port -- only a socket on 9222 that it has to
      # refuse to attach to. Runs here, before npm ci, because the gate and its
      # harness import nothing but Node builtins.
      #
      # Worth a runner step even though the gate is not: the "which process is
      # holding the port" diagnostic only ever surfaces mid-release, so nothing
      # else would notice it rotting until the next time it is needed in a
      # hurry. Safe on windows-latest for the same reason the e2e jobs are not
      # -- nothing binds 9222 there, per the evidence below.
      - name: Packaged-gate CDP preflight tests
        run: node --test scripts/verify-packaged-build.test.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      # --legacy-peer-deps: typescript-eslint 8.x doesn't yet support TypeScript 6
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      # Audit production dependencies only. The high-severity advisories that
      # otherwise fire here are all in dev/build tooling that never ships in the
      # desktop client (undici←jsdom for Vitest's DOM, hono←shadcn CLI), with no
      # upstream fix to bump to. --omit=dev still catches anything that would
      # actually run in the shipped app. Mirrors the Worker audit step below.
      - name: npm audit
        # --omit=dev mirrors the worker audit step: high-severity advisories in
        # dev-only tooling (jsdom→undici, shadcn→hono/js-yaml) don't ship in the
        # app, so audit production deps only.
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/

      # Wider than src/: public/theme-boot.js runs before first paint and
      # scripts/ holds the release gates, and neither was covered by any
      # formatting check — public/theme-boot.js had been dirty for some time.
      - name: Prettier
        run: npm run format:check

      - name: Rust format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Prepare native Slint sidecar placeholder
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Set-Content -NoNewline -Path src-tauri/binaries/kalpa-slint-x86_64-pc-windows-msvc.exe -Value ""

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust dependency audit
        run: |
          cargo install cargo-audit@0.22.1 --quiet --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: Install worker dependencies
        run: npm ci
        working-directory: backend/eso-packs-worker

      # --omit=dev: the worker's only high-severity advisories are in dev/test
      # tooling (esbuild, via @cloudflare/vitest-pool-workers and wrangler),
      # which never ships to Cloudflare. Even the latest Cloudflare tooling
      # still pins the flagged esbuild, so there is no upstream fix to bump to.
      # Auditing production dependencies still catches anything that would
      # actually run in the deployed worker.
      - name: Worker npm audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend/eso-packs-worker

      # `npm run check` rather than a bare tsc: it typechecks the test files too,
      # via test/tsconfig.json. That config was stale and errored on every run,
      # so nothing had ever compiled the worker's tests.
      - name: Worker TypeScript check
        run: npm run check
        working-directory: backend/eso-packs-worker

      - name: Worker unit tests
        run: npx vitest run
        working-directory: backend/eso-packs-worker

      - name: Frontend unit tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri
        run: cargo build --manifest-path src-tauri/Cargo.toml

  # NO e2e job here, and it is not an oversight — `npm run test:e2e:sandbox` is
  # local-only, like `npm run test:packaged`.
  #
  # It was tried on windows-latest three times and failed identically each time.
  # The evidence, from the harness's own diagnostic: the Rust build succeeds, the
  # app launches, our PID is the only kalpa.exe, the process stays alive for the
  # full 120s wait — and `netstat` reports NOTHING listening on 9222. WebView2
  # never binds the debug port on a GitHub runner even though lib.rs sets
  # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS and `tauri build --debug` really does
  # produce a debug_assertions binary.
  #
  # Ruled out along the way: IPv6-vs-IPv4 loopback (the probe now uses 127.0.0.1
  # and still gets ECONNREFUSED), a too-short timeout (30s -> 120s), a
  # non-writable WebView2 user-data folder (given its own directory), and a
  # missing Playwright browser (connectOverCDP never launches one).
  #
  # Before trying again, prove WebView2 can bind a debug port at all on the
  # runner with a minimal app — do not re-litigate the list above.

  # Compile + test the Linux port. Lint/format/audit run once in the Windows
  # job above; this job proves the Linux cfg arms build clean and pass tests.
  # ubuntu-22.04 is the release baseline (WebKitGTK 4.1, glibc 2.35).
  check-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.94.0"
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libxdo-dev build-essential curl wget file

      # --legacy-peer-deps: typescript-eslint 8.x doesn't yet support TypeScript 6
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Frontend unit tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri
        run: cargo build --manifest-path src-tauri/Cargo.toml

  # Compile + test the macOS port (arm64 runner; the release build adds the
  # x86_64 target for a universal binary — CI stays single-arch for speed).
  check-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.94.0"
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      # --legacy-peer-deps: typescript-eslint 8.x doesn't yet support TypeScript 6
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri
        run: cargo build --manifest-path src-tauri/Cargo.toml
